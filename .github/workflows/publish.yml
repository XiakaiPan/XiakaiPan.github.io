name: Publish approved research website
on:
  workflow_dispatch:
    inputs:
      confirm:
        type: choice
        required: true
        options:
          - NOT_APPROVED
          - APPROVED_AND_REVIEWED
permissions:
  contents: read
concurrency:
  group: github-pages-publication
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event.inputs.confirm == 'APPROVED_AND_REVIEWED' && github.event.repository.private == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run release:check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
