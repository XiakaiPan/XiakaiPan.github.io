name: Deploy site to GitHub Pages

# Publishes dist/ to GitHub Pages.
#
# This repository is the PUBLIC half of the site: it holds only outward-facing
# content. The complete private archive (draft pages, historical PDFs, source
# archives, authoring metadata) lives in the private "my-research" repository.
#
# Setup, once:
#   1. Repository visibility = Public (Pages on a free plan needs a public source)
#   2. Settings -> Pages -> Build and deployment -> Source = "GitHub Actions"
#
# Never point Pages at a branch folder. The branch root is the authoring source,
# not the built site; Pages must receive the dist/ artifact produced here.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=moderate

      # Builds dist/ and validates every internal link, asset and anchor.
      - run: npm run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
