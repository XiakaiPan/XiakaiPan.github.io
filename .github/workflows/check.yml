name: Build and check

# Validates the site on pull requests and pushes, so a broken link or an
# unexpected asset fails before it can be published.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      # Builds dist/ and validates every internal link, asset and anchor, plus
      # the published-asset allowlist.
      - run: npm run check
