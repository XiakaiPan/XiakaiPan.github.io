name: Build and check
on:
  pull_request:
  push:
    branches: [master, draft/research-site-2026-10]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: bash -n scripts/setup-showcase-repo.sh scripts/export-showcase.sh
      - run: node --check scripts/release-check.mjs
      - run: node scripts/make-ssg-author-report.mjs --check
      - run: python -m pip install --disable-pip-version-check 'pypdf==6.1.3'
      - run: python scripts/check_ssg_author_pdf.py
      - run: npm run check

