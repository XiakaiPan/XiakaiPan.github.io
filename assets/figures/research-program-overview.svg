<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-label="Research Program Overview: Three Models, SSG, and TSG">
  
  <defs>
    <style>
      .title { font: 700 18px Georgia, "Times New Roman", serif; fill: #1c2825; }
      .subtitle { font: 600 13px system-ui, -apple-system, sans-serif; fill: #19614f; letter-spacing: 0.4px; }
      .kicker { font: 700 10.5px system-ui, -apple-system, sans-serif; fill: #64726d; letter-spacing: 1.2px; text-transform: uppercase; }
      .h { font: 650 14px system-ui, -apple-system, sans-serif; fill: #1c2825; }
      .h-sm { font: 650 12.5px system-ui, -apple-system, sans-serif; fill: #1c2825; }
      .b { font: 450 12px system-ui, -apple-system, sans-serif; fill: #33433e; }
      .b-sm { font: 450 11px system-ui, -apple-system, sans-serif; fill: #52615c; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #19614f; }
      .mono-amber { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8a5612; }
      .mono-blue { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e4b7a; }
      .card { fill: #ffffff; stroke: #ced8d1; stroke-width: 1.25; rx: 8; }
      .card-green { fill: #f2f7f5; stroke: #19614f; stroke-width: 1.5; rx: 8; }
      .card-blue { fill: #f3f7fb; stroke: #2b5c8f; stroke-width: 1.5; rx: 8; }
      .card-amber { fill: #fdf8f0; stroke: #b07219; stroke-width: 1.5; rx: 8; }
      .pill-green { fill: #e3f0ec; stroke: #19614f; stroke-width: 1; rx: 5; }
      .pill-blue { fill: #e6eff8; stroke: #2b5c8f; stroke-width: 1; rx: 5; }
      .pill-amber { fill: #faeedb; stroke: #b07219; stroke-width: 1; rx: 5; }
      .pill-gray { fill: #eef2ef; stroke: #95a39d; stroke-width: 1; rx: 5; }
      .arr { stroke: #19614f; stroke-width: 1.6; fill: none; marker-end: url(#arrow-green); }
      .arr-blue { stroke: #2b5c8f; stroke-width: 1.6; fill: none; marker-end: url(#arrow-blue); }
      .arr-amber { stroke: #b07219; stroke-width: 1.6; fill: none; marker-end: url(#arrow-amber); }
      .arr-muted { stroke: #64726d; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-muted); }
    </style>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#19614f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2b5c8f"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b07219"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64726d"/>
    </marker>
  </defs>

  <rect width="920" height="500" fill="#fafbf8" rx="10" stroke="#dbe2dc" stroke-width="1.5"/>
  
  <!-- Header -->
  <text x="460" y="32" text-anchor="middle" class="kicker">RESEARCH ARCHITECTURE · ONE METHODOLOGY × TWO PARALLEL SUBSTRATE SERIES</text>

  <!-- Top Foundation Box: Three Models -->
  <rect x="40" y="48" width="840" height="128" class="card-amber"/>
  <text x="64" y="73" class="kicker" style="fill:#8a5612">METHODOLOGICAL FOUNDATION</text>
  <text x="64" y="96" class="title">Three Models of World Modeling</text>
  <text x="415" y="95" class="b-sm">Complementary modeling contracts anchored against real-world measurement</text>

  <!-- 3 Model Pillars -->
  <rect x="64" y="110" width="235" height="52" class="pill-amber"/>
  <text x="78" y="131" class="h-sm" style="fill:#694009">1. Formal Model (Legality)</text>
  <text x="78" y="149" class="b-sm">Objects · Relations · Admissible Transforms</text>

  <rect x="315" y="110" width="250" height="52" class="pill-amber"/>
  <text x="329" y="131" class="h-sm" style="fill:#694009">2. Simulation Model (Dynamics)</text>
  <text x="329" y="149" class="b-sm">State Transitions · Calibrated Cost · What-If</text>

  <rect x="581" y="110" width="235" height="52" class="pill-amber"/>
  <text x="595" y="131" class="h-sm" style="fill:#694009">3. Statistical Model (Search)</text>
  <text x="595" y="149" class="b-sm">Parameter Estimation · Amortized Policy</text>

  <!-- Measurement external anchor badge -->
  <rect x="826" y="110" width="40" height="52" fill="#fff" stroke="#8a5612" stroke-dasharray="3 2" rx="4"/>
  <text x="846" y="134" text-anchor="middle" class="b-sm" style="font-weight:700;fill:#8a5612;font-size:9.5px">Meas-</text>
  <text x="846" y="148" text-anchor="middle" class="b-sm" style="font-size:9.5px;fill:#8a5612">urement</text>

  <!-- Connecting arrows down to Series A & B -->
  <path d="M 250 176 L 250 206" class="arr-amber"/>
  <path d="M 670 176 L 670 206" class="arr-amber"/>
  <text x="460" y="196" text-anchor="middle" class="b-sm" style="font-style:italic">Shared modeling discipline; distinct objects of study (not reduced to one another)</text>

  <!-- Left Column: Series A (SSG) -->
  <rect x="40" y="210" width="405" height="236" class="card-green"/>
  <text x="62" y="236" class="kicker" style="fill:#19614f">SERIES A · AI COMPUTING EXECUTION WORLD</text>
  <text x="62" y="260" class="title">SSG — System Substrate Graph</text>
  <text x="62" y="280" class="b"><tspan class="mono">Execution = Schedule(Workload, System)</tspan> over CMC</text>

  <!-- SSG Core Box -->
  <rect x="62" y="294" width="361" height="46" class="pill-green"/>
  <text x="76" y="314" class="h-sm" style="fill:#114538">AbstractSSG × CalibratedSSG → InstantiatedSSG</text>
  <text x="76" y="331" class="b-sm">OpHierarchy · DomainHierarchy · Build–Traverse–Translate</text>

  <!-- SSG Tracks -->
  <rect x="62" y="350" width="114" height="78" class="card"/>
  <text x="72" y="370" class="h-sm" style="fill:#19614f">SSG · Core</text>
  <text x="72" y="387" class="b-sm">Op · Model</text>
  <text x="72" y="402" class="b-sm">Coverage &amp; Emit</text>
  <text x="72" y="418" class="mono" style="font-size:10px">Report · 2026</text>

  <rect x="185" y="350" width="114" height="78" class="card"/>
  <text x="195" y="370" class="h-sm" style="fill:#19614f">SSG Agent</text>
  <text x="195" y="387" class="b-sm">Agent · Model · Op</text>
  <text x="195" y="402" class="b-sm">CPU / GPU</text>
  <text x="195" y="418" class="mono" style="font-size:10px">In progress</text>

  <rect x="309" y="350" width="114" height="78" class="card"/>
  <text x="319" y="370" class="h-sm" style="fill:#19614f">SSG-DT</text>
  <text x="319" y="387" class="b-sm">Calibrated Twin</text>
  <text x="319" y="402" class="b-sm">Perf &amp; Co-Design</text>
  <text x="319" y="418" class="mono" style="font-size:10px">In progress</text>

  <!-- Right Column: Series B (TSG) -->
  <rect x="475" y="210" width="405" height="236" class="card-blue"/>
  <text x="497" y="236" class="kicker" style="fill:#2b5c8f">SERIES B · HUMAN–AI EVOLVING TASK WORLD</text>
  <text x="497" y="260" class="title">TSG — Task Substrate Graph</text>
  <text x="497" y="280" class="b">The task, not the agent or session, persists.</text>

  <!-- TSG Core Box -->
  <rect x="497" y="294" width="361" height="46" class="pill-blue"/>
  <text x="511" y="314" class="h-sm" style="fill:#183a5e">Context: Owner × Location × Operation(CDC)</text>
  <text x="511" y="331" class="b-sm">Nodes: Actor × Spec(R, T, C) × Impl · Roles: C · M · A</text>

  <!-- TSG 3 Aspects -->
  <rect x="497" y="350" width="114" height="78" class="card"/>
  <text x="507" y="370" class="h-sm" style="fill:#2b5c8f">1. Context &amp; G_T</text>
  <text x="507" y="387" class="b-sm">Intent×Discipline</text>
  <text x="507" y="402" class="b-sm">Actor×Spec×Impl</text>
  <text x="507" y="418" class="mono-blue" style="font-size:10px">Graph structure</text>

  <rect x="620" y="350" width="114" height="78" class="card"/>
  <text x="630" y="370" class="h-sm" style="fill:#2b5c8f">2. CMA Roles</text>
  <text x="630" y="387" class="b-sm">Component·Model</text>
  <text x="630" y="402" class="b-sm">Artifact Reification</text>
  <text x="630" y="418" class="mono-blue" style="font-size:10px">Exchange roles</text>

  <rect x="744" y="350" width="114" height="78" class="card"/>
  <text x="754" y="370" class="h-sm" style="fill:#2b5c8f">3. Evolution</text>
  <text x="754" y="387" class="b-sm">Intra-Task Identity</text>
  <text x="754" y="402" class="b-sm">Inter-Task Reuse</text>
  <text x="754" y="418" class="mono-blue" style="font-size:10px">Task dynamics</text>

  <!-- Interaction footer bar -->
  <path d="M 445 325 L 475 325" class="arr-muted"/>
  <path d="M 475 312 L 445 312" class="arr-muted"/>
  <rect x="40" y="456" width="840" height="30" class="pill-gray"/>
  <text x="460" y="476" text-anchor="middle" class="b-sm">
    <tspan style="font-weight:700;fill:#1c2825">Relationship:</tspan> Parallel series. A TSG task can describe research on SSG; SSG can execute computational steps of a task. Neither requires the other.
  </text>
</svg>
