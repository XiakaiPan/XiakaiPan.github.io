<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" role="img" aria-label="SSG-DT Structure-Preserving Execution and Simulation Correspondence">
  
  <defs>
    <style>
      .title { font: 700 18px Georgia, "Times New Roman", serif; fill: #1c2825; }
      .subtitle { font: 600 13px system-ui, -apple-system, sans-serif; fill: #19614f; letter-spacing: 0.4px; }
      .kicker { font: 700 10.5px system-ui, -apple-system, sans-serif; fill: #64726d; letter-spacing: 1.2px; text-transform: uppercase; }
      .h { font: 650 14px system-ui, -apple-system, sans-serif; fill: #1c2825; }
      .h-sm { font: 650 12.5px system-ui, -apple-system, sans-serif; fill: #1c2825; }
      .b { font: 450 12px system-ui, -apple-system, sans-serif; fill: #33433e; }
      .b-sm { font: 450 11px system-ui, -apple-system, sans-serif; fill: #52615c; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #19614f; }
      .mono-amber { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8a5612; }
      .mono-blue { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e4b7a; }
      .card { fill: #ffffff; stroke: #ced8d1; stroke-width: 1.25; rx: 8; }
      .card-green { fill: #f2f7f5; stroke: #19614f; stroke-width: 1.5; rx: 8; }
      .card-blue { fill: #f3f7fb; stroke: #2b5c8f; stroke-width: 1.5; rx: 8; }
      .card-amber { fill: #fdf8f0; stroke: #b07219; stroke-width: 1.5; rx: 8; }
      .pill-green { fill: #e3f0ec; stroke: #19614f; stroke-width: 1; rx: 5; }
      .pill-blue { fill: #e6eff8; stroke: #2b5c8f; stroke-width: 1; rx: 5; }
      .pill-amber { fill: #faeedb; stroke: #b07219; stroke-width: 1; rx: 5; }
      .pill-gray { fill: #eef2ef; stroke: #95a39d; stroke-width: 1; rx: 5; }
      .arr { stroke: #19614f; stroke-width: 1.6; fill: none; marker-end: url(#arrow-green); }
      .arr-blue { stroke: #2b5c8f; stroke-width: 1.6; fill: none; marker-end: url(#arrow-blue); }
      .arr-amber { stroke: #b07219; stroke-width: 1.6; fill: none; marker-end: url(#arrow-amber); }
      .arr-muted { stroke: #64726d; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-muted); }
    </style>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#19614f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2b5c8f"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b07219"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64726d"/>
    </marker>
  </defs>

  <rect width="900" height="410" fill="#fafbf8" rx="10" stroke="#dbe2dc" stroke-width="1.5"/>
  <text x="450" y="30" text-anchor="middle" class="kicker">SSG-DT · STRUCTURE-PRESERVING EXECUTION &amp; SIMULATION CORRESPONDENCE</text>

  <!-- Left: Shared Structural Source -->
  <rect x="36" y="65" width="245" height="260" class="card-green"/>
  <text x="54" y="92" class="kicker" style="fill:#19614f">SHARED PLAN IDENTITY</text>
  <text x="54" y="116" class="title" style="font-size:17px">Instantiated SSG</text>
  <text x="54" y="140" class="b-sm">Explicit execution structure:</text>
  <rect x="54" y="152" width="209" height="32" class="pill-green"/>
  <text x="66" y="172" class="mono" style="font-size:10.5px">Domain Partition &amp; Tiling</text>
  <rect x="54" y="192" width="209" height="32" class="pill-green"/>
  <text x="66" y="212" class="mono" style="font-size:10.5px">Selected PhysicalEdges</text>
  <rect x="54" y="232" width="209" height="32" class="pill-green"/>
  <text x="66" y="252" class="mono" style="font-size:10.5px">Pipeline &amp; Sync Depth</text>
  <text x="54" y="290" class="b-sm">Shared IDs connect both</text>
  <text x="54" y="306" class="b-sm">execution and prediction.</text>

  <!-- Fork Arrows -->
  <path d="M 281 135 L 330 115" class="arr"/>
  <path d="M 281 255 L 330 275" class="arr-blue"/>

  <!-- Top Center: Execution Path -->
  <rect x="334" y="65" width="255" height="118" class="card"/>
  <text x="352" y="90" class="kicker" style="fill:#19614f">PATH A · REAL EXECUTION (PAPER 1)</text>
  <text x="352" y="112" class="h">Backend Realizer &amp; Profiling</text>
  <text x="352" y="132" class="b-sm">• Emit CUDA / Triton / Runtime calls</text>
  <text x="352" y="150" class="b-sm">• Hardware runs (H20 / A800)</text>
  <text x="352" y="168" class="b-sm">• Per-span latency, DRAM bytes, clocks</text>

  <!-- Bottom Center: Digital Twin Path -->
  <rect x="334" y="207" width="255" height="118" class="card-blue"/>
  <text x="352" y="232" class="kicker" style="fill:#2b5c8f">PATH B · PROPOSED DIGITAL TWIN</text>
  <text x="352" y="254" class="h">Cost Calibration &amp; Replay Design</text>
  <text x="352" y="274" class="b-sm">• Node/Edge parameter calibration</text>
  <text x="352" y="292" class="b-sm">• Compositional critical-path &amp; overlap</text>
  <text x="352" y="310" class="b-sm">• Static + local event simulation</text>

  <!-- Join Arrows -->
  <path d="M 589 124 L 632 155" class="arr"/>
  <path d="M 589 266 L 632 235" class="arr-blue"/>

  <!-- Right: Audit & Co-Design -->
  <rect x="636" y="65" width="228" height="260" class="card-amber"/>
  <text x="654" y="92" class="kicker" style="fill:#8a5612">EVALUATION &amp; CO-DESIGN</text>
  <text x="654" y="116" class="title" style="font-size:17px">Fidelity &amp; Transfer</text>

  <rect x="654" y="132" width="192" height="54" class="card"/>
  <text x="666" y="152" class="h-sm" style="font-size:12px;fill:#694009">D1 · Compositional Fidelity</text>
  <text x="666" y="170" class="b-sm">Node/Edge/Domain residual</text>

  <rect x="654" y="196" width="192" height="54" class="card"/>
  <text x="666" y="216" class="h-sm" style="font-size:12px;fill:#694009">D2 · Cross-Gen Transfer</text>
  <text x="666" y="234" class="b-sm">Ranking across shapes/tiers</text>

  <rect x="654" y="260" width="192" height="50" class="card"/>
  <text x="666" y="280" class="h-sm" style="font-size:12px;fill:#694009">D3 · HW/SW Co-Design</text>
  <text x="666" y="298" class="b-sm">Counterfactual arch what-if</text>

  <!-- Bottom Bar -->
  <rect x="36" y="346" width="828" height="44" class="pill-gray"/>
  <text x="450" y="373" text-anchor="middle" class="b-sm">
    <tspan style="font-weight:700">Why Correspondence Matters:</tspan> Because simulation consumes the exact <tspan class="mono">InstantiatedSSG</tspan> that Realizer compiles, prediction errors can be attributed to specific edges or domains rather than hidden in an end-to-end black box.
  </text>
</svg>
