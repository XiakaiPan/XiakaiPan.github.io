<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-label="Three Models of World Modeling Triangle and Measurement Anchor">
  
  <defs>
    <style>
      .title { font: 700 18px Georgia, "Times New Roman", serif; fill: #1c2825; }
      .subtitle { font: 600 13px system-ui, -apple-system, sans-serif; fill: #19614f; letter-spacing: 0.4px; }
      .kicker { font: 700 10.5px system-ui, -apple-system, sans-serif; fill: #64726d; letter-spacing: 1.2px; text-transform: uppercase; }
      .h { font: 650 14px system-ui, -apple-system, sans-serif; fill: #1c2825; }
      .h-sm { font: 650 12.5px system-ui, -apple-system, sans-serif; fill: #1c2825; }
      .b { font: 450 12px system-ui, -apple-system, sans-serif; fill: #33433e; }
      .b-sm { font: 450 11px system-ui, -apple-system, sans-serif; fill: #52615c; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #19614f; }
      .mono-amber { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #8a5612; }
      .mono-blue { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1e4b7a; }
      .card { fill: #ffffff; stroke: #ced8d1; stroke-width: 1.25; rx: 8; }
      .card-green { fill: #f2f7f5; stroke: #19614f; stroke-width: 1.5; rx: 8; }
      .card-blue { fill: #f3f7fb; stroke: #2b5c8f; stroke-width: 1.5; rx: 8; }
      .card-amber { fill: #fdf8f0; stroke: #b07219; stroke-width: 1.5; rx: 8; }
      .pill-green { fill: #e3f0ec; stroke: #19614f; stroke-width: 1; rx: 5; }
      .pill-blue { fill: #e6eff8; stroke: #2b5c8f; stroke-width: 1; rx: 5; }
      .pill-amber { fill: #faeedb; stroke: #b07219; stroke-width: 1; rx: 5; }
      .pill-gray { fill: #eef2ef; stroke: #95a39d; stroke-width: 1; rx: 5; }
      .arr { stroke: #19614f; stroke-width: 1.6; fill: none; marker-end: url(#arrow-green); }
      .arr-blue { stroke: #2b5c8f; stroke-width: 1.6; fill: none; marker-end: url(#arrow-blue); }
      .arr-amber { stroke: #b07219; stroke-width: 1.6; fill: none; marker-end: url(#arrow-amber); }
      .arr-muted { stroke: #64726d; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-muted); }
    </style>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#19614f"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#2b5c8f"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#b07219"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#64726d"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#fafbf8" rx="10" stroke="#dbe2dc" stroke-width="1.5"/>
  <text x="450" y="32" text-anchor="middle" class="kicker">THREE MODELS OF WORLD MODELING · BARYCENTRIC METHODOLOGY &amp; EXTERNAL MEASUREMENT ANCHOR</text>

  <!-- Left Side: Method Triangle -->
  <polygon points="280,75 105,345 455,345" fill="#fdfaf3" stroke="#b07219" stroke-width="2"/>
  <line x1="280" y1="75" x2="280" y2="345" stroke="#e4d5be" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="105" y1="345" x2="367" y2="210" stroke="#e4d5be" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="455" y1="345" x2="193" y2="210" stroke="#e4d5be" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Trajectory curve inside triangle -->
  <path d="M 268 142 Q 255 245 368 295" fill="none" stroke="#19614f" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Vertex 1: Formal -->
  <rect x="175" y="44" width="210" height="50" class="card-amber"/>
  <text x="280" y="65" text-anchor="middle" class="h-sm" style="fill:#694009">Formal Model — Legality</text>
  <text x="280" y="82" text-anchor="middle" class="b-sm">Objects · Constraints · Legal Space</text>

  <!-- Vertex 2: Simulation -->
  <rect x="24" y="352" width="225" height="54" class="card-amber"/>
  <text x="136" y="373" text-anchor="middle" class="h-sm" style="fill:#694009">Simulation Model — Value</text>
  <text x="136" y="391" text-anchor="middle" class="b-sm">Dynamics · Calibrated Cost · What-If</text>

  <!-- Vertex 3: Statistical -->
  <rect x="330" y="352" width="225" height="54" class="card-amber"/>
  <text x="442" y="373" text-anchor="middle" class="h-sm" style="fill:#694009">Statistical Model — Search</text>
  <text x="442" y="391" text-anchor="middle" class="b-sm">Calibration · Policy · Amortization</text>

  <!-- Interior Points (Barycentric Prototypes) -->
  <circle cx="268" cy="142" r="7" fill="#19614f"/>
  <rect x="282" y="122" width="168" height="38" class="pill-green"/>
  <text x="292" y="139" class="h-sm" style="font-size:11.5px;fill:#114538">Function Prototype (FP)</text>
  <text x="292" y="153" class="b-sm" style="font-size:10px">Formal dom. + HW constraints</text>

  <circle cx="232" cy="252" r="7" fill="#19614f"/>
  <rect x="135" y="258" width="182" height="38" class="pill-green"/>
  <text x="145" y="275" class="h-sm" style="font-size:11.5px;fill:#114538">Performance Prototype (PP)</text>
  <text x="145" y="289" class="b-sm" style="font-size:10px">Sim dom. + Stat calibration</text>

  <circle cx="368" cy="295" r="7" fill="#19614f"/>
  <rect x="335" y="242" width="172" height="38" class="pill-green"/>
  <text x="345" y="259" class="h-sm" style="font-size:11.5px;fill:#114538">Learnable Prototype (LP)</text>
  <text x="345" y="273" class="b-sm" style="font-size:10px">Stat policy + Sim reward</text>

  <!-- Dashed External Measurement Anchor Line -->
  <line x1="560" y1="60" x2="560" y2="395" stroke="#19614f" stroke-width="2.2" stroke-dasharray="7 5"/>
  <text x="575" y="78" class="kicker" style="fill:#19614f">EXTERNAL REALITY ANCHOR (NOT A 4TH VERTEX)</text>

  <!-- Ties to measurement line -->
  <path d="M 450 141 L 555 141" class="arr-muted"/>
  <path d="M 317 277 L 555 235" class="arr-muted"/>
  <path d="M 507 261 L 555 315" class="arr-muted"/>

  <!-- Right Side Explanation Cards -->
  <rect x="578" y="96" width="295" height="92" class="card"/>
  <text x="594" y="118" class="h-sm" style="fill:#19614f">1. Legal Realization &amp; Correctness</text>
  <text x="594" y="137" class="b-sm">Formal models define what is legal; real hardware</text>
  <text x="594" y="153" class="b-sm">compilation &amp; numerical checks verify realization</text>
  <text x="594" y="169" class="mono" style="font-size:10.5px">SSG Paper 1 · TSG Foundation</text>

  <rect x="578" y="200" width="295" height="92" class="card"/>
  <text x="594" y="222" class="h-sm" style="fill:#2b5c8f">2. Calibrated Prediction vs. Measurement</text>
  <text x="594" y="241" class="b-sm">Simulation stays distinct from measurement so</text>
  <text x="594" y="257" class="b-sm">predictive fidelity &amp; transfer can be falsified</text>
  <text x="594" y="273" class="mono-blue" style="font-size:10.5px">SSG-DT · Counterfactual What-If</text>

  <rect x="578" y="304" width="295" height="92" class="card"/>
  <text x="594" y="326" class="h-sm" style="fill:#8a5612">3. Constrained Amortized Search</text>
  <text x="594" y="345" class="b-sm">Statistical policies amortize search over legal</text>
  <text x="594" y="361" class="b-sm">candidates using calibrated simulation rewards</text>
  <text x="594" y="377" class="mono-amber" style="font-size:10.5px">Learnable Prototype (Wave 3–4)</text>
</svg>